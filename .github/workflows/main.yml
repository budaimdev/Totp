name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Deploy Android
    runs-on: ubuntu-latest

    steps:
      # 1. Stažení kódu (Aktualizováno na v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Nastavení Javy (Důležité pro stabilitu Android buildu, doporučená verze 17)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Nastavení Flutteru s povolenou keší (Ušetří hromadu času při dalším běhu)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true # Automaticky kešuje pub dependencies a Flutter SDK

      # 4. Instalace závislostí
      - name: Install dependencies
        run: flutter pub get

      # 5. Statická analýza kódu
      - name: Analyze code
        run: flutter analyze

      # 6. Spuštění unit a widget testů
      #- name: Run tests
       # run: flutter test

      # 7. Build aplikací (Generujeme APK pro testery a AAB pro Google Play)
      - name: Build Release Binaries
        run: |
          flutter build apk --release
          flutter build appbundle --release

      # 8. Nahrání APK jako artefaktu (Aktualizováno na v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 9. Nahrání AAB (App Bundle) jako artefaktu
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract app version
        id: app_version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: v${{ steps.app_version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/app-release.apk
            dist/app-release.aab
